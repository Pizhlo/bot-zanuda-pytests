name: Тесты

on:
  push:
    branches: [main, develop]
    # Один список для push и PR: тесты auth-service и влияющие на них зависимости.
    # При новой общей зависимости добавьте её сюда. Документация и tests/webserver не входят.
    paths: &auth_service_paths
      - 'tests/auth_service/**'
      - 'parameters/auth_service/**'
      - 'assertions/auth_service.py'
      - 'assertions/__init__.py'
      - 'parameters/__init__.py'
      - 'tests/fixtures/**'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'conftest.py'
      - 'src/**'
      - 'utils/**'
      - 'testdata/auth-service/**'
      - 'tools/seed_auth.py'
      - 'tools/__init__.py'
      # Смена версии сабмодуля меняет gitlink testkit, а не файлы внутри каталога.
      - 'testkit'
      - '.gitmodules'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'pytest.ini'
      - 'setup.cfg'
      - '.github/workflows/auth-service.yaml'
  pull_request:
    branches: [main, develop]
    # *auth_service_paths повторно использует список выше; проверяется весь diff PR.
    paths: *auth_service_paths
  workflow_dispatch:
    inputs:
      auth_image:
        description: Образ auth-service для ручного запуска (по умолчанию собирается из auth_ref)
        type: string

      auth_ref:
        description: Ревизия auth-service для сборки и строгой модели OpenFGA
        type: string

jobs:
  auth-service:
    # Fork PR не получает Secrets и доступ к приватному testkit: пропускаем до checkout.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: 'true'
      AUTH_IMAGE_OVERRIDE: ${{ inputs.auth_image }}
      AUTH_FGA_MODEL_FILE: ${{ github.workspace }}/.testkit-runs/auth-source/fga/auth-model.fga
      # Повторный запуск задания получает новый изолированный проект.
      RUN_ID: auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Получить код и закреплённый testkit
        uses: actions/checkout@v4
        with:
          # Один закреплённый коммит testkit для локального запуска и CI.
          submodules: recursive
          # Поддерживаем оба существующих имени токена для приватного сабмодуля.
          token: ${{ secrets.CI_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
          persist-credentials: false
      - name: Получить исходники сервиса и модель той же ревизии
        uses: actions/checkout@v4
        with:
          repository: Pizhlo/bot-zanuda-auth-service
          ref: ${{ inputs.auth_ref || vars.AUTH_SERVICE_REF || 'main' }}
          path: .testkit-runs/auth-source
          token: ${{ secrets.CI_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
          persist-credentials: false
      - name: Выбрать образ для интеграционных тестов
        working-directory: .testkit-runs/auth-source
        run: |
          revision=$(git rev-parse HEAD)
          if [ -n "$AUTH_IMAGE_OVERRIDE" ]; then
            docker pull -- "$AUTH_IMAGE_OVERRIDE"
            image_id=$(docker image inspect --format '{{.Id}}' -- "$AUTH_IMAGE_OVERRIDE")
            image_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")
            if [ "$image_revision" != "$revision" ]; then
              echo "::error::Ревизия образа auth_image должна совпадать с checkout $revision (метка org.opencontainers.image.revision)."
              exit 1
            fi
          else
            docker build -t "auth-under-test:$revision" \
              --label "org.opencontainers.image.revision=$revision" \
              --build-arg VERSION="$revision" --build-arg GIT_COMMIT="$revision" \
              --build-arg BUILD_DATE="$(git show -s --format=%cI)" .
            image_id=$(docker image inspect --format '{{.Id}}' "auth-under-test:$revision")
          fi
          echo "AUTH_REF=$revision" >> "$GITHUB_ENV"
          echo "AUTH_IMAGE=$image_id" >> "$GITHUB_ENV"
      - name: Установить зависимость скрипта запуска
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Выполнить полный прогон тестов auth-service
        run: make integration-run
      # Дополнительная диагностика, если общий runner завершился раньше подготовки/уборки.
      - name: Собрать оставшиеся логи
        if: always()
        run: |
          if [ -f testkit/Makefile ]; then
            make integration-logs
          fi
      # Отдельный always-шаг выполняется даже при ошибке сбора логов.
      - name: Удалить оставшееся окружение
        if: always()
        run: |
          if [ -f testkit/Makefile ]; then
            make integration-down
          fi
