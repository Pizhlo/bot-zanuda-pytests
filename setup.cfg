[flake8]
show-source = true
statistics = false
doctests = true

extend-exclude = .venv, .git, __pycache__, .pytest_cache, .ruff_cache, .mypy_cache, .tox, .coverage, .coverage.*
select = WPS, E999, ANN001, ANN002, ANN003, ANN201, ANN202, ANN203, ANN204, ANN205, ANN206, ANN402
# unittest.assertRaises/contextlib сохраняют результат контекста для проверок после with.
per-file-ignores =
    # Декларативные кейсы сохраняют явные ожидания; повтор выражений здесь намеренный.
    parameters/auth_service/*.py: WPS204
    checks/test_auth_data.py: WPS441
    checks/test_config_selection.py: WPS441
    src/storages/vault_client.py: WPS214, WPS226
    src/common/audit.py: WPS226
    src/models/resource.py: WPS231, WPS232, WPS223
ignore = WPS301, WPS202, WPS479, WPS237, WPS480